# grilling.yaml — chew a design question down before asking anyone about it.
#
# Most of the questions worth asking a person answer themselves on the way to
# being said plainly. This workflow makes that the default order: one
# question at a time, explained to a middle-school reader first, then argued
# with, and only then handed to a human — and only the ones still standing.
#
# The shape:
#
#   frame ──> simplify ──> challenge ──> decide ─┬─ questions left ──> simplify
#                                                └─ empty ──> settle ──> $end
#
# Conventions this workflow relies on (own them, they are not headsign's).
# Everything lives under .headsign/tmp/, which the next `headsign start`
# empties:
#   questions        — the open points, one per line, written by `frame` and
#                      shortened by `decide`.
#   current-question — the ONE question this lap claimed, copied verbatim
#                      from the head of the list.
#   plain.md         — this lap's plain-language explanation of it.
#   challenge.md     — the naive "why?"s put to that explanation, and the
#                      answers.
#   decisions.md     — the settled answers, appended one lap at a time.
#   plan.md          — `settle`'s write-up.

version: 0.1
name: design-grilling
entry: frame

phases:
  # ── frame ────────────────────────────────────────────────────────────────
  # The list first, and only the list. A question thought through while the
  # list is still being written quietly rewrites the list to suit the answer.
  frame:
    description: >
      Write the open points of this design, one per line, in
      `.headsign/tmp/questions` — no blank lines, no numbering. A line is one
      question a person could answer yes/no or pick between; "how should the
      cache work" is a topic, not a question, so split it until each line
      names a decision. Do not answer anything in this phase.
    # Cleared on entry, which for the entry phase means on `headsign start`:
    # a list or a decision log left over from an earlier session would send
    # this run through questions nobody asked this time.
    clear: [.headsign/tmp/questions, .headsign/tmp/decisions.md, .headsign/tmp/corrections.md]
    gate:
      checks:
        - name: at least one question framed
          # "is there a line with a non-space character on it", not `test -s`,
          # which would accept a file of blank lines and keep the loop turning
          # forever. This exact command is `decide`'s `when:` too: the loop
          # ends on the same condition that let it start.
          run: "grep -q '[^[:space:]]' .headsign/tmp/questions"
    on_pass: simplify
    max_attempts: 3

  # ── simplify ─────────────────────────────────────────────────────────────
  # Explain it before asking about it. This phase and `challenge` are
  # deliberately two phases, not one: a step that says "now argue with your
  # own conclusion" is the first step to get skipped when it sits at the
  # bottom of the instructions that produced the conclusion. Split apart, the
  # instruction to argue arrives AFTER the conclusion exists, addressed to an
  # agent that has already committed to it — which is the only moment at
  # which it does any work.
  simplify:
    description: >
      Claim the head of the list — `head -n 1 .headsign/tmp/questions >
      .headsign/tmp/current-question` — and, before asking anyone anything,
      explain that ONE question to a middle-school reader in
      `.headsign/tmp/plain.md`: what is actually being decided, what the
      candidate answers are, and what each one costs. Use
      `.headsign/notes/explaining-well.md` as the standard for the writing.
      Say where you land and why. Most of the time the answer falls out here,
      and that is the point of the phase — you are not preparing a question,
      you are trying to make it unnecessary.
    # Cleared on every entry, and every way in is a real transition (from
    # frame, from decide's loop-back), so neither the claim nor the previous
    # question's prose carries over.
    clear: [.headsign/tmp/current-question, .headsign/tmp/plain.md]
    ready: "test -s .headsign/tmp/plain.md"
    gate:
      checks:
        - name: exactly one question claimed
          run: 'test "$(grep -c "[^[:space:]]" .headsign/tmp/current-question)" -eq 1'
        - name: a plain-language explanation was written
          run: "test -s .headsign/tmp/plain.md"
    on_pass: challenge
    max_attempts: 3

  # ── challenge ────────────────────────────────────────────────────────────
  # The phase that exists because it would otherwise be skipped. See the note
  # above `simplify` for why it is not folded into it.
  #
  # The instruction to attack groupings was added after a run where this phase
  # verified every individual claim and still missed the mistake: three
  # different budgets — a counter of successful laps, a counter of gate
  # failures, and a counter of both — had been reasoned about as one kind of
  # thing, and every sentence written about them was true. The question that
  # broke it came from a person, and it was not "why is that true" but "is
  # that really the same thing as the others".
  #
  # The instruction to count existing instances before accepting a refusal was
  # added after a run refused to put a value in state.json because it would
  # duplicate a fact the log already records — while four pairs in that same
  # file do exactly that: `claimed` with `driver_agent`, `paused` with the
  # `stop_nudges` reset, `stalled` with `stop_nudges: 5`, `graph-changed` with
  # `graph_change_reported`. That lap's challenge was not idle: it checked how
  # the costs had been grouped and threw out an analogy that did not hold. It
  # never asked how the record's existing fields relate to the log's existing
  # lines. A person reversed it in one sentence.
  #
  # Note the shape, because it is the mirror of the rule above and not a
  # restatement of it: attacking groupings catches a false *identity* ("these
  # are all the same kind of thing"), and this catches a false *exception*
  # ("this would be the only one of its kind here").
  challenge:
    description: >
      Put naive "why?" questions to the explanation you just wrote, and write
      both the questions and your answers to `.headsign/tmp/challenge.md`.
      Go after the load-bearing words first — every "cannot", "always",
      "impossible", "obviously", "of course" in `.headsign/tmp/plain.md` is a
      claim, so ask why each one is true and answer it from the code or the
      docs rather than from memory. Then go after the groupings, which hide
      better than the words do: wherever the explanation says "these are all
      X" or reasons about several things at once, ask whether they are really
      the same kind of thing. A claim can be true of every member of a
      category that should never have been one category. Ask like someone who
      does not already agree with you.

      Then, wherever the explanation *refuses* something — a field, a line, a
      command — because it would duplicate what is already there, or because
      this project does not do that sort of thing, go and count the existing
      instances before you accept the refusal. Find none and the refusal
      stands. Find four and what you are refusing is the house pattern, and
      the refusal is the thing that has to defend itself.

      If an answer turns out to be weaker than the claim, that is a result: go
      back and rewrite `.headsign/tmp/plain.md` before moving on, and say in
      this file what changed.

      Then append the outcome to `.headsign/tmp/corrections.md`, which is the
      only file in this run that survives the lap: the claimed question line
      verbatim, and under it what the challenge changed in the explanation —
      or, when it changed nothing, say that. Write it for someone who will
      read it without `challenge.md` in front of them, because they will:
      this file is cleared on the way into the next question and that one is
      not.
    # challenge.md is cleared on entry; corrections.md deliberately is not.
    # Everything this phase finds lives in a file that the next lap destroys,
    # so what survives is only what got carried out by hand. In the run that
    # produced this rule, fourteen questions wrote fourteen of these files and
    # thirteen were thrown away — the seven mistakes the challenging caught
    # survived because the agent chose to copy them, not because anything
    # asked it to.
    clear: [.headsign/tmp/challenge.md]
    ready: "test -s .headsign/tmp/challenge.md"
    gate:
      checks:
        - name: the challenge was written down
          run: "test -s .headsign/tmp/challenge.md"
        - name: it contains at least one question
          # Honest, not smart: it proves something was asked, never that it
          # was a good question. A file with no question mark in it is a
          # summary of the explanation, which is what this phase exists not
          # to be.
          run: "grep -q -e '?' -e '？' .headsign/tmp/challenge.md"
        - name: this lap left a line in the surviving record
          # Same idiom as decide's second check, and honest in the same way:
          # it proves the question reached corrections.md, never that what was
          # written under it is true. A lap that changed nothing still has to
          # say so — an empty entry and a missing entry read the same later,
          # and only one of them is a claim.
          run: 'cat .headsign/tmp/corrections.md 2>/dev/null | grep -qF -e "$(head -n 1 .headsign/tmp/current-question)"'
    on_pass: decide
    max_attempts: 3

  # ── decide ───────────────────────────────────────────────────────────────
  # The loop's hinge, and the only place a person is asked anything.
  #
  # Waiting for that person needs no machinery: write one line to
  # `.headsign/tmp/stop-note` and end the turn. The stop-boundary hook lets
  # the stop through quietly, records `paused` in `.headsign/log`, and the run
  # resumes from this phase with `headsign next` once the answer is in.
  # Deliberately no `ready:` probe here for that reason — the run leaves the
  # turn rather than polling from inside it.
  #
  # ONE NOTE COVERS ONE TURN END. The hook consumes the file, so a wait that
  # spans several turns — they ask a question back, you answer, the turn ends
  # again — needs the note written again each time. Measured, not assumed: the
  # second turn end of a wait in this repo was nudged because the file from
  # the first was already gone.
  decide:
    description: >
      If `.headsign/tmp/plain.md` and `.headsign/tmp/challenge.md` settled
      the question, record it: append the question line verbatim to
      `.headsign/tmp/decisions.md` with the decision and the reason under it.
      **And say so out loud, in this turn, to the person who asked for the
      work** — what the question was, what the explaining changed on the way
      to answering it, and why nobody needed to be asked. A question you
      settled yourself is the one that person never sees; from where they sit,
      a lap that asks nothing and a lap that thought about nothing look
      identical. Tell them, briefly, and let them stop you if the answer is
      wrong.
      If it is genuinely still open, this is the moment to ask a person —
      state the question in the plain terms you just worked out, offer the
      candidate answers and what each costs, write `.headsign/tmp/stop-note`
      and end your turn. Asking always means pausing — never ask and keep
      working in the same turn, and never guess an answer to keep the run
      moving. Write the note again before every turn that ends still waiting:
      the hook consumes it, so one note covers one turn end, and a wait that
      takes three exchanges needs three notes. When the answer arrives, record
      it the same way. Either way, finish by removing the claimed line from
      `.headsign/tmp/questions` and then run `headsign next`.
    gate:
      checks:
        - name: the claimed question left the list
          # -F -x so the line is matched whole and literally. This is what
          # makes the loop finite: a question left on the list comes round
          # again and again until max_total_iterations stops it.
          run: '! grep -qxF -e "$(head -n 1 .headsign/tmp/current-question)" .headsign/tmp/questions'
        - name: its decision is on the record
          # Concatenated through `cat` so a decisions.md that does not exist
          # yet is an empty stream rather than a grep error (exit 2), which is
          # not the same answer as "not found" and must not be read as one.
          run: 'cat .headsign/tmp/decisions.md 2>/dev/null | grep -qF -e "$(head -n 1 .headsign/tmp/current-question)"'
    on_pass:
      # Same predicate as frame's gate. A questions file that has gone missing
      # exits nonzero too — "not this branch" — and the run takes the default
      # edge, which is the right answer for a list that is gone.
      - when: "grep -q '[^[:space:]]' .headsign/tmp/questions"
        to: simplify
      - to: settle
    max_attempts: 5

  # ── settle ───────────────────────────────────────────────────────────────
  # Reached only once every question has an answer on the record.
  #
  # WRITE FOR SOMEONE WHO WAS NOT HERE. The question list was framed inside
  # this run and nobody outside it has ever seen it, so its ordering is
  # private: "decision 4" names a position in a file the reader does not have.
  # This is not a style note — it was the one complaint a real reader made
  # about the first plan this workflow produced, and it made the report
  # unreadable to the person who had asked for the work.
  settle:
    description: >
      Write `.headsign/tmp/plan.md` from `.headsign/tmp/decisions.md`: what
      was agreed, the order the work should now be done in, and what is
      deliberately not being done.

      Write it for a reader who never saw the question list. **Never refer to
      an answer by its number or position** — not "decision 4", not "the fifth
      question", not "as decided above". Name the thing instead: "the attempt
      counter moves to the judge's side". Each item states its premise before
      its conclusion: what was true before, what changes, what it costs. A
      reader who has only this file should be able to act on it.

      Note which answers came from a person and which the explaining produced
      on its own — the second kind is what tells you whether this loop is
      earning its keep. `.headsign/tmp/corrections.md` is the record of that
      second kind: read it before writing, and carry what it holds into the
      plan under its own heading — every place the challenging moved the
      answer, and what the belief was before it moved. That list is the part
      a reader cannot reconstruct from the decisions alone, and it is the
      evidence for or against running this loop again.

      Copy the plan **and `corrections.md`** somewhere durable before you
      finish; `.headsign/tmp/` does not survive the next `headsign start`.
    gate:
      checks:
        - name: the plan was written
          run: "test -s .headsign/tmp/plan.md"
        - name: no answer is referred to by its number
          # Honest, not smart: it proves one form of words is absent, never
          # that a stranger can read the prose. It is here because that exact
          # form is what broke the first plan this workflow produced — the
          # reader who had asked for the work could not tell what "decision 4"
          # meant, and the numbering was an artifact of a list only the run
          # ever saw. Everything else about writing for an outsider is in the
          # description, unenforced; this one part is cheap to check, so it is.
          run: '! grep -qiE "(decisions?|questions?|問い|決定)[[:space:]]*#?[0-9]" .headsign/tmp/plan.md'
    on_pass: $end
    max_attempts: 3

limits:
  # Three gate evaluations per question (simplify, challenge, decide), plus
  # frame and settle once each. So this covers about a dozen questions with
  # room for the usual retries. A design session with more open points than
  # that wants splitting, not a bigger number.
  max_total_iterations: 40
