# triage.yaml — headsign's own feedback-intake loop. One run = one ticket.
#
# Feedback tickets accumulate, pull-style, in a PRIVATE aggregation
# repository; its location resolves via `git config --global
# headquarters.issuesDir` (never a relative/sibling path — that breaks under
# git worktrees). A ticket is a `bd` issue: labels carry the tool and the
# severity, the status carries how far it has come (open -> judged ->
# closed), and the Judgment and the Response are comments whose `author` is
# `tool:headsign`. That hub holds several tools' queues side by side and
# tells them apart by label, so every command below names this one — an
# issue labelled for a sibling tool is not this run's work and must not trip
# its gate.
#
# `judged` is not one of bd's built-in statuses. The hub configures it
# (`status.custom`), and a hub that lost that setting makes every query
# below fail loudly rather than answer "nothing to do": bd refuses the
# unknown status, prints no JSON, and `jq -e` exits non-zero. Measured
# before this file was written, because three of these gates asserts an
# absence and a silent empty answer would certify a queue nobody looked at.
#
# Read before writing: `bd -C "$HQ" dolt pull`. Publishing what you wrote
# follows the hub's own README — this file does not own that step.
#
# This repository is PUBLIC. The check for every artifact here (code,
# commit messages, docs, tests) is authorship: nothing may be anyone's
# words but ours. Never paste ticket text or logs; a light edit that
# keeps the source's wording or skeleton is still a paste. Write from
# scratch about the general problem. Private names and ticket ids are
# only the easiest leaks to spot — a search for identifiers does not
# clear a change. The ticket-to-commit link lives in the ticket's
# Response field on the private side only. See docs/maintenance.md.
version: 0.1
name: feedback-triage
entry: triage

phases:
  triage:
    description: >
      Let HQ="$(git config --global headquarters.issuesDir)". Pull first:
      `bd -C "$HQ" dolt pull`. If an issue labelled tool:headsign already
      sits at status judged, that is your work item from an earlier run —
      touch .headsign/tmp/triage-done and run `headsign next` to proceed.
      Otherwise take exactly ONE issue from
      `bd -C "$HQ" list --label tool:headsign --status open` — severity
      high before mid before low (the severity: label), oldest first within
      a severity — and judge it alone; never batch. Write the judgment as a
      comment on that issue, `bd -C "$HQ" comments add <id> --file <path>
      --actor tool:headsign`, holding a decision (accept / reject / defer)
      and a reason. Then set where it stands: accept and defer take
      `bd -C "$HQ" update <id> --status judged`; reject takes
      `bd -C "$HQ" close <id>` with the reason written carefully, because
      for a rejected ticket the reason is the whole answer. **If the
      decision was reject or defer, also touch
      .headsign/tmp/judged-not-accepted** — that is what sends the reason
      to be reviewed instead of straight to the reporter. When triage is
      done — one ticket judged, or the queue turned out empty — touch
      .headsign/tmp/triage-done and run `headsign next`.
    # ready: is this run's own "I finished triaging" declaration, NOT a
    # probe of the queue: the queue alone cannot distinguish "just
    # rejected the last ticket" (should end cleanly) from "haven't
    # started yet" (should keep waiting), and a premature `next` before
    # judging must PENDING-wait here rather than be routed anywhere.
    ready: "test -f .headsign/tmp/triage-done"
    gate:
      # What the gate judges is no longer WHICH decision was reached — that
      # is a destination, and destinations belong on the routes below
      # (ADR-0011). It judges the one thing that can actually be wrong
      # here: a ticket that was judged and then left where unjudged tickets
      # live. `- decision: ` with something after it is the mark of a
      # judged ticket, so a template scaffold copied in with the field
      # still empty does not trip it.
      #
      # This used to be "is there an accepted ticket in judged/", with
      # `on_fail: $end` carrying reject, defer and an empty inbox out of
      # the run. That made a gate FAILURE the way a normal outcome was
      # expressed, which is the shape `what-headsign-protects` #7 exists to
      # remove: branching belongs on the pass path so nobody has to ask
      # whether ending cleanly costs an attempt.
      checks:
        # Reachability first, because the check under it asserts an ABSENCE:
        # a query that answers nothing looks exactly like a clean queue. An
        # unset `headquarters.issuesDir`, a hub that moved, a bd that is not
        # installed — each would otherwise report a tidy queue while never
        # looking at one. Asking for the array and requiring it to BE an
        # array is what separates "bd answered, and the answer was empty"
        # from "bd never answered". A gate check rather than `ready:` on
        # purpose — a missing config is a thing to surface, not to wait for.
        - name: the hub answers for this tool
          run: >
            bd -C "$(git config --global headquarters.issuesDir)" list
            --label tool:headsign --status open --json | jq -e 'type == "array"' >/dev/null
        # The mistake this catches is the one the two writes make possible:
        # the judgment comment landed and the status never moved, so a
        # judged ticket still sits in the open queue and the next run picks
        # it up as unjudged. `author` is the mark, not the comment's text —
        # a comment is written by whoever wrote it, and only this tool
        # writes as `tool:headsign`.
        - name: no judged ticket left at status open
          run: |
            HQ="$(git config --global headquarters.issuesDir)"
            ! bd -C "$HQ" list --label tool:headsign --status open --json |
              jq -r '.[].id' |
              while read -r id; do
                bd -C "$HQ" comments "$id" --json |
                  jq -e 'any(.[]; .author == "tool:headsign")' >/dev/null && echo "$id"
              done | grep -q .
    # The marker is read FIRST, and that order is load-bearing now: accept
    # and defer both leave the ticket at status judged, so the queue alone
    # can no longer tell them apart — it could when accept and defer wrote
    # their decision into a file this route could grep. What still separates
    # them is whose run it was, and that is the phase's own declaration.
    #
    # Under it, the durable status carries the case the marker cannot: an
    # accepted ticket left at judged by an earlier run has to find its way
    # to implement too, and that run's marker is long gone.
    on_pass:
      - when: "test -f .headsign/tmp/judged-not-accepted"
        to: review_judgment
      - when: >
          bd -C "$(git config --global headquarters.issuesDir)" list
          --label tool:headsign --status judged --json | jq -e 'length > 0' >/dev/null
        to: implement
      - to: "$end"
    # An empty inbox takes the default route and ends the run cleanly
    # (COMPLETE); that is the intended outcome, not a failure. A real
    # failure here means a judged ticket is still sitting in inbox/ — move
    # it, then ask again.
    on_fail: retry
    max_attempts: 3

  review_judgment:
    description: >
      The ticket judged this run was rejected or deferred, so nothing will
      be built and **the reason IS the whole answer the reporter gets**.
      Until now nothing has reviewed it. The review comes from a reader that
      can read and search but writes nothing, pointed at that ticket's
      Judgment and Response in the feedback repository — how you arrange that
      reader is yours. Have it check three things
      against THIS tree rather than on trust: every factual claim about
      headsign (a file, a symbol, an ADR, a default, a documented
      sentence) is verified where it lives; every unconditional statement
      is tested for the condition that would falsify it — an optional
      field left undeclared, a limit nobody set; and each of the
      reporter's own proposals is answered rather than restated. Have it
      REPORT exactly APPROVED or REJECTED with reasons, then write that
      verdict verbatim to .headsign/tmp/verdict yourself. On REJECTED,
      correct the judgment on the issue — `bd -C "$HQ" comments add <id>`
      with the corrected text, `--actor tool:headsign` — before asking
      again. The reporter has not been told anything yet, so a correction
      here is a correction to a draft.
    # Re-entering rather than staying (`on_fail: review_judgment`, not
    # `retry`): the stale verdict has to go, and `clear:` runs on entry.
    clear: [.headsign/tmp/verdict]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: judgment review approved
          run: "grep -qx APPROVED .headsign/tmp/verdict"
    on_pass: "$end"
    on_fail: review_judgment
    # Same reading as review's below — rounds already spent, not the round
    # starting. Fewer than review's because there is no code here to ripple
    # through, and no second language: what a round can move is one ticket's
    # text, in one place. Left at 4 when review went to 8, because nothing has
    # been observed about this one.
    max_attempts: 4

  implement:
    description: >
      Implement the accepted ticket — the issue labelled tool:headsign
      that stands at status judged, read with
      `bd -C "$HQ" show <id>` and `bd -C "$HQ" comments <id>`.
      Work test-first where
      practical, keep engine.ts pure, respect docs/architecture.md module
      boundaries, keep README.md / README.ja.md in parity, and rebuild the
      bundle before asking for the verdict. PUBLIC-REPO RULE: every
      sentence you commit — in code, tests, docs and commit messages —
      must be written from scratch in our own words. Never paste the
      ticket's text, logs or paths; a light edit that keeps its wording
      or skeleton is still a paste. Restate the problem and the
      reproduction in general terms (docs/maintenance.md). Commit in
      meaningful units.
    gate:
      checks:
        - name: typecheck
          run: "npm run typecheck"
        - name: tests
          run: "npm test"
          timeout: 300
        - name: bundle matches src
          run: "npm run build && git diff --quiet -- plugin/dist"
        - name: versions in lockstep
          run: >
            node -e "const p=require('./package.json').version,
            q=require('./plugin/.claude-plugin/plugin.json').version;
            if(p!==q){console.error('version mismatch: '+p+' vs '+q);process.exit(1)}"
    on_pass: review
    max_attempts: 5

  review:
    description: >
      The review comes from a reader that can read and search but writes
      nothing — arrange it as you see fit — checking the
      diff against docs/architecture.md's module boundaries,
      .headsign/notes/what-headsign-protects.md, README EN/JA parity — and
      the public-repo rule above: check authorship sentence by sentence —
      the diff and its commit messages must contain no text that arrived
      from the ticket, quoted or lightly edited with its wording or
      skeleton kept. A search for private names and ids is not the check.
      Have it REPORT
      exactly APPROVED or REJECTED with reasons, then write that verdict
      verbatim to .headsign/tmp/verdict yourself.
    clear: [.headsign/tmp/verdict]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: review approved
          run: "grep -qx APPROVED .headsign/tmp/verdict"
    on_pass: respond
    on_fail: implement
    # Counts REJECTED verdicts across the whole run, not per visit: `on_fail:
    # implement` leaves the phase and comes back, and re-entering does not
    # reset the counter. So this is "how many rounds of review this ticket
    # gets", and `headsign status`'s `attempt n/8` is rounds already spent —
    # not, as it reads at a glance, which round is starting.
    #
    # Was 3, and 3 turned out to be a review-round budget rather than a
    # stuck-loop detector: a change that touches a documented invariant
    # spends rounds on the records around it, one per record the reviewer
    # can only see once the one before it is fixed. Three such rounds are
    # progress, not a loop.
    #
    # Then 5, and 5 ran out the same way on a change that stated one rule in
    # six places — a design record, two reference pages in two languages, the
    # changelog, the code comments, and a test name. Each round the reviewer
    # could reach the next place only once the one before it was fixed, so the
    # rounds were a count of the layers rather than a count of circles: the
    # code was settled after round two and every later round moved prose. The
    # budget fired with one wrong sentence left. 8 covers a rule that lives in
    # that many places once.
    #
    # What this budget cannot tell is a review walking layers from a review
    # walking in place. If it runs out again, read the rejections before
    # raising it: rounds that each name a NEW place are progress, and rounds
    # that keep naming the same place are the loop this is here to stop.
    max_attempts: 8

  respond:
    description: >
      Close the loop on the private side: write the response as a comment
      on the issue — what was done and the public commit hash(es),
      `bd -C "$HQ" comments add <id> --file <path> --actor tool:headsign` —
      then `bd -C "$HQ" close <id>`. The link always points private ->
      public; never add the reverse link in this repository. If a mistake
      turns up after the response is sent, add a corrected comment with a
      dated heading rather than rewriting the one already read: it lands
      after the reporter's mark, which is what puts it in their next sweep.
    gate:
      checks:
        # One query does both jobs here, which the directory version needed
        # two checks for. Asking how many issues stand at judged is only
        # answerable when bd ran and the hub knows that status, so a hub
        # that moved or lost its custom status makes this red — it cannot
        # answer "none left" without having looked.
        - name: no judged ticket left behind
          run: >
            bd -C "$(git config --global headquarters.issuesDir)" list
            --label tool:headsign --status judged --json | jq -e 'length == 0' >/dev/null
    on_pass: "$end"
    max_attempts: 3

limits:
  max_total_iterations: 20
