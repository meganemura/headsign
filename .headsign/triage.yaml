# triage.yaml — headsign's own feedback-intake loop. One run = one ticket.
#
# Feedback tickets accumulate, pull-style, in a PRIVATE aggregation
# repository; its location resolves via `git config --global
# headsign.feedbackDir` (never a relative/sibling path — that breaks under
# git worktrees). Tickets carry frontmatter (severity, created), a Judgment
# section (decision: accept / reject / defer + reason) and a Response
# section, and move feedback/headsign/inbox/ -> judged/ -> done/ as they
# progress. That hub holds several tools' queues side by side, one directory
# per tool, so every path below names this one — a ticket sitting in a
# sibling tool's inbox is not this run's work and must not trip its gate.
#
# This repository is PUBLIC. Nothing that identifies a feedback source may
# enter any artifact here (code, commit messages, docs, tests): no private
# project names, no ticket ids, no quoted logs or paths. Generalize
# everything; the ticket-to-commit link lives in the ticket's Response
# field on the private side only. See docs/maintenance.md.
version: 0.1
name: feedback-triage
entry: triage

phases:
  triage:
    description: >
      Let FB="$(git config --global headsign.feedbackDir)/feedback/headsign".
      If judged/ under it already holds a ticket with "decision:
      accept", that is your work item from an earlier run — touch
      .headsign/tmp/triage-done and run `headsign next` to proceed.
      Otherwise take exactly ONE ticket from inbox/ — severity
      high before mid before low (frontmatter), oldest `created` first
      within a severity — and judge it alone; never batch. Fill its
      Judgment section: decision (accept / reject / defer) plus a reason.
      Then move it with `git mv`: accept and defer go to judged/;
      reject goes straight to done/ with the reason written
      carefully, and its frontmatter `status:` follows the directory it
      lands in. Commit in the feedback repository. **If the decision was
      reject or defer, also touch .headsign/tmp/judged-not-accepted** —
      that is what sends the reason to be reviewed instead of straight to
      the reporter. When triage is done — one ticket judged, or the inbox
      turned out empty — touch .headsign/tmp/triage-done and run `headsign
      next`.
    # ready: is this run's own "I finished triaging" declaration, NOT a
    # probe of the queue: the queue alone cannot distinguish "just
    # rejected the last ticket" (should end cleanly) from "haven't
    # started yet" (should keep waiting), and a premature `next` before
    # judging must PENDING-wait here rather than be routed anywhere.
    ready: "test -f .headsign/tmp/triage-done"
    gate:
      # What the gate judges is no longer WHICH decision was reached — that
      # is a destination, and destinations belong on the routes below
      # (ADR-0011). It judges the one thing that can actually be wrong
      # here: a ticket that was judged and then left where unjudged tickets
      # live. `- decision: ` with something after it is the mark of a
      # judged ticket, so a template scaffold copied in with the field
      # still empty does not trip it.
      #
      # This used to be "is there an accepted ticket in judged/", with
      # `on_fail: $end` carrying reject, defer and an empty inbox out of
      # the run. That made a gate FAILURE the way a normal outcome was
      # expressed, which is the shape `what-headsign-protects` #7 exists to
      # remove: branching belongs on the pass path so nobody has to ask
      # whether ending cleanly costs an attempt.
      checks:
        # Reachability first, because the check under it asserts an ABSENCE: a
        # glob that expands to nothing makes `grep -qs` report no match, and
        # `!` turns that into a pass identical to a clean inbox. An unset
        # `headsign.feedbackDir` or a hub that moved would otherwise report a
        # tidy queue while never looking at one. A gate check rather than
        # `ready:` on purpose — a missing config is a thing to surface, not a
        # thing to wait for.
        - name: feedback queue is reachable
          run: 'test -d "$(git config --global headsign.feedbackDir)/feedback/headsign/inbox"'
        - name: no judged ticket left in inbox/
          run: '! grep -qs "^- decision: ." "$(git config --global headsign.feedbackDir)"/feedback/headsign/inbox/*.md'
    # Judged state lives in the ticket files themselves: an accepted ticket
    # sitting in judged/ IS the work queue (capacity one by convention),
    # which is why the first route reads the durable ticket rather than a
    # marker — an accepted ticket left over from an earlier run has to find
    # its way to implement too. The second route cannot be read off the
    # queue that way: a rejected ticket lands in done/ next to every
    # previously rejected one, so "did THIS run reject something" is the
    # phase's own declaration, exactly like `ready:` above.
    on_pass:
      - when: 'grep -qs "decision: accept" "$(git config --global headsign.feedbackDir)"/feedback/headsign/judged/*.md'
        to: implement
      - when: "test -f .headsign/tmp/judged-not-accepted"
        to: review_judgment
      - to: "$end"
    # An empty inbox takes the default route and ends the run cleanly
    # (COMPLETE); that is the intended outcome, not a failure. A real
    # failure here means a judged ticket is still sitting in inbox/ — move
    # it, then ask again.
    on_fail: retry
    max_attempts: 3

  review_judgment:
    description: >
      The ticket judged this run was rejected or deferred, so nothing will
      be built and **the reason IS the whole answer the reporter gets**.
      Until now nothing has reviewed it. The review comes from a reader that
      can read and search but writes nothing, pointed at that ticket's
      Judgment and Response in the feedback repository — how you arrange that
      reader is yours. Have it check three things
      against THIS tree rather than on trust: every factual claim about
      headsign (a file, a symbol, an ADR, a default, a documented
      sentence) is verified where it lives; every unconditional statement
      is tested for the condition that would falsify it — an optional
      field left undeclared, a limit nobody set; and each of the
      reporter's own proposals is answered rather than restated. Have it
      REPORT exactly APPROVED or REJECTED with reasons, then write that
      verdict verbatim to .headsign/tmp/verdict yourself. On REJECTED, fix
      the ticket text in the feedback repository and commit there before
      asking again.
    # Re-entering rather than staying (`on_fail: review_judgment`, not
    # `retry`): the stale verdict has to go, and `clear:` runs on entry.
    clear: [.headsign/tmp/verdict]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: judgment review approved
          run: "grep -qx APPROVED .headsign/tmp/verdict"
    on_pass: "$end"
    on_fail: review_judgment
    # Same reading as review's below — rounds already spent, not the round
    # starting. Fewer than review's 5 because there is no code here to
    # ripple through: what a round can move is one ticket's text.
    max_attempts: 4

  implement:
    description: >
      Implement the accepted ticket (the "decision: accept" file in the
      feedback repository's feedback/headsign/judged/). Work test-first where
      practical, keep engine.ts pure, respect docs/architecture.md module
      boundaries, keep README.md / README.ja.md in parity, and rebuild the
      bundle before asking for the verdict. PUBLIC-REPO RULE: commit
      messages, code, tests and docs must describe the change in general
      terms only — never the feedback source's project name, ticket id,
      quoted logs or paths. Rewrite reproduction steps neutrally. Commit in
      meaningful units.
    gate:
      checks:
        - name: typecheck
          run: "npm run typecheck"
        - name: tests
          run: "npm test"
          timeout: 300
        - name: bundle matches src
          run: "npm run build && git diff --quiet -- plugin/dist"
        - name: versions in lockstep
          run: >
            node -e "const p=require('./package.json').version,
            q=require('./plugin/.claude-plugin/plugin.json').version;
            if(p!==q){console.error('version mismatch: '+p+' vs '+q);process.exit(1)}"
    on_pass: review
    max_attempts: 5

  review:
    description: >
      The review comes from a reader that can read and search but writes
      nothing — arrange it as you see fit — checking the
      diff against docs/architecture.md's module boundaries,
      .headsign/notes/what-headsign-protects.md, README EN/JA parity — and
      the public-repo rule above: the diff and its commit messages must
      contain nothing that identifies the feedback source. Have it REPORT
      exactly APPROVED or REJECTED with reasons, then write that verdict
      verbatim to .headsign/tmp/verdict yourself.
    clear: [.headsign/tmp/verdict]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: review approved
          run: "grep -qx APPROVED .headsign/tmp/verdict"
    on_pass: respond
    on_fail: implement
    # Counts REJECTED verdicts across the whole run, not per visit: `on_fail:
    # implement` leaves the phase and comes back, and re-entering does not
    # reset the counter. So this is "how many rounds of review this ticket
    # gets", and `headsign status`'s `attempt n/5` is rounds already spent —
    # not, as it reads at a glance, which round is starting.
    #
    # Was 3, and 3 turned out to be a review-round budget rather than a
    # stuck-loop detector: a change that touches a documented invariant
    # spends rounds on the records around it, one per record the reviewer
    # can only see once the one before it is fixed. Three such rounds are
    # progress, not a loop. 5 leaves room for that and still stops a review
    # that is circling.
    max_attempts: 5

  respond:
    description: >
      Close the loop on the private side: fill the ticket's Response
      section with what was done and the public commit hash(es), `git mv`
      the ticket from feedback/headsign/judged/ to feedback/headsign/done/
      with its frontmatter `status:` following the move, and commit the
      feedback repository. The link always points private -> public; never
      add the reverse link in this repository.
    gate:
      checks:
        # Reachability first, for the reason the triage gate states: the check
        # under it asserts an absence, and an unreachable path satisfies it
        # without reading anything — here that would certify a loop closed
        # while the ticket sits in judged/.
        - name: feedback queue is reachable
          run: 'test -d "$(git config --global headsign.feedbackDir)/feedback/headsign/judged"'
        # Mechanical: the accepted ticket really left the queue.
        - name: no accepted ticket left in judged/
          run: '! grep -qs "decision: accept" "$(git config --global headsign.feedbackDir)"/feedback/headsign/judged/*.md'
    on_pass: "$end"
    max_attempts: 3

limits:
  max_total_iterations: 20
