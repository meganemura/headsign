# fitness.yaml — headsign's own fitness function: can each function in src/ be
# explained to a middle-school reader?
#
# It replaces a number. The ~500-code-line guideline stopped detecting
# anything: src/ went past 2x it and no one stopped, while every design
# problem we actually found was found because an explanation had gone long.
# So the sweep asks for the explanation directly. A failure here does not say
# "the codebase is fat" — it says "THIS function is too complicated", and
# names it. See docs/adr/0016-explainability-as-the-fitness-function.md.
#
# The shape:
#
#   inventory ──> explain ──> judge ─┬─ APPROVED ─────────> record
#                     ↑              ├─ third try ────────> record (as a miss)
#                     └──────────────┴─ otherwise ────────> explain
#   record ─┬─ queue not empty ──> explain
#           └─ empty ──> learn ──> improve ──> report ──> $end
#
# Conventions this workflow relies on (own them, they are not headsign's).
# Everything lives under .headsign/tmp/, which the next `headsign start`
# empties:
#   queue        — the functions still to explain, `module.ts:name`, one per
#                  line, written by `inventory` and shortened by `record`.
#   current      — the ONE function this lap claimed, copied verbatim from
#                  the head of the queue.
#   scope        — one line of plain English saying what this run swept,
#                  written by `inventory` and repeated by `report`.
#   explain.md   — this attempt's explanation. The judge reads this and
#                  nothing else.
#   verdict      — APPROVED / REJECTED for THIS attempt, written by the judge
#                  itself and cleared before each new one.
#   verdicts     — every verdict the judge has written about the CURRENT item,
#                  appended, with its note. Its count is the attempt number;
#                  `record` clears it as it moves on to the next item.
#   done         — items whose explanation was approved.
#   unexplained  — functions that ran out of attempts. Data, not a stop.
#   lessons.md   — what `learn` took from the sweep.
#   summary.md   — `report`'s write-up.
#
# The failure discipline: a function nobody could explain does NOT stop the
# run. It is recorded and the sweep goes on, so what reaches a person reads
# "these 3 of 71 could not be explained" rather than "we got stuck on the
# first one" — and the learning phases run either way. `report`'s
# `on_fail: escalate` is the actual verdict of this fitness function.

version: 0.1
name: explainability-fitness
entry: inventory

phases:
  # ── inventory ────────────────────────────────────────────────────────────
  # Build the list before explaining anything. A list written while
  # explaining is shaped by the explaining: the functions that turned out
  # awkward quietly stop getting listed.
  inventory:
    description: >
      A run covers ONE module. Ask which one if you were not told; do not
      queue all of `src/`, and see the note under `limits:` for what that
      would cost. List every function in that module in
      `.headsign/tmp/queue`, one per line, written as `module.ts:name` (for
      example `engine.ts:step`) — no blank lines, no numbering, no other
      content. Include nested and non-exported functions; they are where
      complexity hides.

      Then write what you queued, in one line of plain English, to
      `.headsign/tmp/scope` — for example `the functions of gate.ts`. That
      line is the run's scope, and `report` is required to repeat it: the
      phase that knows what was swept is this one, and a report that
      reconstructs it later is how a sweep ends up claiming more than it
      earned.

      Do not start explaining anything in this phase.
    # Cleared on entry, which for the entry phase means on `headsign start`:
    # a queue or a ledger left over from an earlier sweep would make this run
    # chew through the wrong functions and report counts it never earned.
    clear:
      - .headsign/tmp/queue
      - .headsign/tmp/scope
      - .headsign/tmp/done
      - .headsign/tmp/unexplained
      - .headsign/tmp/unstated
      - .headsign/tmp/unfocused
      - .headsign/tmp/verdicts
    gate:
      checks:
        - name: queue has at least one function
          # "is there a line with a non-space character on it", not `test -s`,
          # which would accept a file of blank lines and keep the loop turning
          # forever. This exact command is `record`'s `when:` too: the loop
          # ends on the same condition that let it start.
          run: "grep -q '[^[:space:]]' .headsign/tmp/queue"
        - name: the scope is written down
          # Checked here rather than trusted, because `report`'s scope check
          # fails OPEN without it: `grep -qF -e "$(cat scope)"` on a missing
          # file searches for the empty string, which matches every line. A
          # sweep with no scope would then pass the check that exists to stop
          # it claiming more than it swept.
          run: "grep -q '[^[:space:]]' .headsign/tmp/scope"
    on_pass: explain
    max_attempts: 3

  # ── explain ──────────────────────────────────────────────────────────────
  # One item, one explanation, one attempt. Re-entered from `judge` when the
  # judge said REJECTED.
  #
  # THIS PHASE NO LONGER COUNTS ANYTHING. It used to append to a `tries` file
  # that the give-up route read — which put the counter in the hands of the
  # participant with an interest in reaching the give-up. That was harmless
  # while giving up meant filing one function and moving on; it stops being
  # harmless when it means escaping a third rewrite of a long document. The
  # count now comes from the judge's side (see `judge`), which has no stake in
  # whether the writing continues.
  explain:
    description: >
      Claim the head of the queue — `head -n 1 .headsign/tmp/queue >
      .headsign/tmp/current` — and explain that one item to a middle-school
      reader in `.headsign/tmp/explain.md`. Read
      `.headsign/notes/explaining-well.md` first and follow it; that file is
      the standard, and it grows every run. Write the explanation for someone
      who will never see the source — the judge is not allowed to look at it
      either. If you find yourself unable to say a clause plainly, that
      clause is the finding; say what makes it hard rather than dressing it
      in a bigger word.

      If this is not your first attempt at this item, read
      `.headsign/tmp/verdicts` first: it holds every verdict the judge has
      written about it, in order, with the note attached to each. The same
      clause defeating two rewrites is worth more than the latest complaint
      about it.
    # Cleared on every entry, and every way in is a real transition (from
    # inventory, from judge's rejection edge, from record's loop-back), so
    # neither the claim nor last lap's prose can carry over: each attempt has
    # to say out loud which function it is on and write its own explanation.
    clear: [.headsign/tmp/current, .headsign/tmp/explain.md]
    # Paired with `clear:` so an early `headsign next` answers PENDING and
    # costs nothing, instead of failing a gate on a file that does not exist.
    ready: "test -s .headsign/tmp/explain.md"
    gate:
      checks:
        - name: exactly one function claimed
          run: 'test "$(grep -c "[^[:space:]]" .headsign/tmp/current)" -eq 1'
        - name: an explanation was written
          run: "test -s .headsign/tmp/explain.md"
    on_pass: judge
    max_attempts: 5

  # ── judge ────────────────────────────────────────────────────────────────
  # THE JUDGE WRITES THE VERDICT FILE ITSELF. The working agent does not
  # transcribe a reported verdict here — transcription puts the pen back in
  # the writer's hand, and a writer at try 3 of 3 can approve its own prose.
  # This is the middle rung of docs/adr/0007-verdict-authorship.md: the
  # working agent COULD overwrite the file afterwards, but it did not write
  # it, and that is a different thing from authoring it.
  #
  # No `claude -p`: the judge is a subagent of this session, so it costs no
  # extra process, no extra API surface, and no assumption about which CLI is
  # installed. What matters is not the mechanism but that the judgment leaves
  # this context and comes back as a file the judge wrote.
  #
  # THE JUDGE ALSO KEEPS THE COUNT, in `.headsign/tmp/verdicts`, appended and
  # never cleared until the sweep moves to the next item. Two files, both
  # written by the judge, doing two jobs that must not be merged:
  #
  #   verdict   — cleared on entry, so its presence proves THIS attempt was
  #               judged. A judge that produces nothing fails the gate loudly
  #               instead of letting a stale answer route the lap.
  #   verdicts  — the running log. Its count of verdict words is the attempt
  #               number the give-up route reads, and its notes are what
  #               attempt 3 gets to read before rewriting.
  #
  # Why the count moved here: it used to live in a `tries` file appended by
  # `explain`, which is the writer's own phase — the participant with an
  # interest in reaching the give-up. One extra `echo` bought an escape from a
  # third rewrite, and the check on it (`test -s`) could not tell a fresh line
  # from a stale file. The judge has no stake in whether the writing goes on.
  #
  # What is still trusted rather than proven: a judge that writes `verdict`
  # and forgets to append to `verdicts` stalls the count. The gate below
  # catches it whenever the two disagree, which is always on the first attempt
  # and whenever the answer changed — not when a second REJECTED follows a
  # first. Honest, not smart: the motive is gone, the possibility is not.
  judge:
    description: >
      Delegate the verdict. Spawn ONE subagent whose only writable paths are
      `.headsign/tmp/verdict` and `.headsign/tmp/verdicts`, and tell it to
      write its own answer there — do not report the verdict back and copy it
      down yourself.

      Give the judge exactly this question, unchanged:

      "Read ONLY `.headsign/tmp/explain.md`. Do not open `src/`, and do not
      use anything you already know about this codebase. Could a reader who
      has read this explanation and nothing else predict what this function
      does — what it is given, what it returns or changes, and what it does
      at the edges (empty input, a missing file, a value nobody declared)?
      Write APPROVED or REJECTED, on a line of its own, to
      `.headsign/tmp/verdict`, replacing whatever is there. Then APPEND the
      same word to `.headsign/tmp/verdicts`, on a line of its own, and if
      REJECTED add below it the first sentence where the reader loses the
      thread and the one thing they still could not predict. Write to no
      other file."

      Do not soften that question and do not add "is this clear?" to it — a
      question about clarity gets a polite yes, and a question about
      prediction gets an answer that can be wrong. If the judge answers
      REJECTED, you will be sent back to `explain`; you get three attempts at
      an item before the sweep gives up on it.
    # Fresh every entry: a verdict from the previous attempt (or the previous
    # item) would route this lap on evidence about something else. `verdicts`
    # is deliberately NOT here — it is the log the count is read from.
    clear: [.headsign/tmp/verdict]
    ready: "test -s .headsign/tmp/verdict"
    gate:
      checks:
        - name: the judge answered
          # Stronger than "the file is not empty" on purpose: the routes below
          # branch on this word, and a file of prose with no verdict line in
          # it would fall through to the default edge and be counted as a
          # rejection nobody actually made.
          run: "grep -qx -e APPROVED -e REJECTED .headsign/tmp/verdict"
        - name: the answer reached the log
          # `verdict` is fresh this attempt, so requiring the log to end with
          # the same word proves an append happened consistent with it — and
          # fails outright when the log is missing or empty, which is the case
          # that would otherwise leave the count at zero forever.
          run: 'test "$(grep -x -e APPROVED -e REJECTED .headsign/tmp/verdicts 2>/dev/null | tail -n 1)" = "$(grep -x -e APPROVED -e REJECTED .headsign/tmp/verdict)"'
    # Branching sits on the PASS path (docs/adr/0011): answering the judge is
    # not a failure, so a rejection costs no attempt here and the give-up edge
    # is a declared destination rather than an exhausted budget.
    on_pass:
      - when: "grep -qx APPROVED .headsign/tmp/verdict"
        to: record
      # Three attempts is where an item stops being a writing problem and
      # starts being a design finding. Counted from the judge's log, not from
      # anything the writer wrote.
      - when: 'test "$(grep -cx -e APPROVED -e REJECTED .headsign/tmp/verdicts)" -ge 3'
        to: record
      - to: explain
    max_attempts: 3

  # ── record ───────────────────────────────────────────────────────────────
  # The loop's hinge. The gate proves this function really left the queue —
  # forgetting that is the one mistake that makes this workflow infinite — and
  # the `when:` asks the queue, not the agent, whether there is another lap.
  record:
    description: >
      File the result for the function in `.headsign/tmp/current`. If
      `.headsign/tmp/verdict` says APPROVED, append it to
      `.headsign/tmp/done`; otherwise append it to
      `.headsign/tmp/unexplained` and put the judge's note about where the
      reader lost the thread on the lines BELOW it. Either way the function
      goes on a line of its own, byte-identical to how it appeared in the
      queue — the gate matches it as a whole line — and then that line comes
      out of `.headsign/tmp/queue`. An unexplained function is data, not a
      reason to stop: it is exactly the finding this sweep exists to produce,
      and `report` is where it reaches a person.
    # The verdict log belongs to one item. Cleared here, on the way to the
    # next one, rather than in `explain` or `judge`, either of which is
    # re-entered once per attempt and would reset the count it is supposed to
    # be accumulating.
    clear: [.headsign/tmp/verdicts]
    gate:
      checks:
        - name: the claimed function left the queue
          # -F -x so the item is matched as a whole line, literally.
          run: '! grep -qxF -e "$(head -n 1 .headsign/tmp/current)" .headsign/tmp/queue'
        - name: the result is on one of the two ledgers
          # Keeps `report`'s counts honest: once the queue is empty these two
          # files are the only record of what the sweep covered. Concatenated
          # rather than handed to grep as two paths: one of the two is
          # normally absent, and grep reports a missing file as an error
          # (exit 2), which is not the same answer as "not found" and must
          # not be read as one.
          run: 'cat .headsign/tmp/done .headsign/tmp/unexplained 2>/dev/null | grep -qxF -e "$(head -n 1 .headsign/tmp/current)"'
    on_pass:
      # Same predicate as inventory's gate. A queue file that has gone missing
      # exits nonzero too — "not this branch" — and the run takes the default
      # edge, which is the right answer for a queue that is gone.
      - when: "grep -q '[^[:space:]]' .headsign/tmp/queue"
        to: explain
      - to: learn
    max_attempts: 3

  # ── learn ────────────────────────────────────────────────────────────────
  # Reached only once the queue is empty, and reached whether or not anything
  # went unexplained. The sweep's value is not the tally; it is this.
  learn:
    description: >
      Write to `.headsign/tmp/lessons.md` what this sweep taught, using
      `.headsign/tmp/done` and `.headsign/tmp/unexplained` as the evidence:
      which explanations landed and what specifically made them land, which
      ones the judge threw out and where the reader lost the thread, and
      which rejections were really about the code rather than the prose.
      Quote the sentences; a lesson without the case that produced it turns
      back into a platitude on the next pass.
    gate:
      checks:
        - name: lessons written
          run: "test -s .headsign/tmp/lessons.md"
    on_pass: improve
    max_attempts: 3

  # ── improve ──────────────────────────────────────────────────────────────
  # The phase that edits the thing it is running inside. ADR-0003: a
  # `description` is stage direction and only gates decide, so the advice is
  # what may safely change mid-run — it is read again on the next entry, and
  # nothing has been decided from it.
  #
  # WHY THE TWO-NAME GUARD BELOW IS ENOUGH: `headsign next` re-reads
  # .headsign/fitness.yaml on every single call, so the only definitions this
  # run still depends on are the phases it has not entered yet — `improve`
  # (this one, which it may be asked to re-run) and `report`. Every phase
  # before them is behind this run for good and can be rewritten freely; the
  # next `headsign start` picks up the new graph. And a rewrite that breaks
  # the file is not a silent loss: `next` fails to load it and exits 3 with
  # the validation errors, leaving state.json exactly as it was, so the run
  # resumes as soon as the file parses again.
  improve:
    description: >
      Fold `.headsign/tmp/lessons.md` into `.headsign/notes/*.md` — usually
      `explaining-well.md`, with the concrete examples attached. You may also
      edit this workflow, `.headsign/fitness.yaml`, with two exceptions: DO
      NOT change the definition of the `improve` phase or the definition of
      the `report` phase. Those are the two this run has still to walk
      through; everything before them is behind it and is yours to change. If
      what you want is a structural change — a new phase, a different graph,
      a gate that would need discussion — do not apply it. Write the proposal
      into `.headsign/notes/` and let a person take it.
    gate:
      checks:
        # Two checks rather than one alternation, so a failure names which of
        # the two went missing. Both are asked because this run needs both.
        - name: this run can still finish — improve is still defined
          run: "grep -qE '^  improve:' .headsign/fitness.yaml"
        - name: this run can still finish — report is still defined
          run: "grep -qE '^  report:' .headsign/fitness.yaml"
    on_pass: report
    max_attempts: 3

  # ── report ───────────────────────────────────────────────────────────────
  # The fitness verdict itself, and the only phase that can fail the sweep.
  # `on_fail: escalate` hands it to a person on the first failure — which is
  # the point: "these cannot be explained" is a design judgment, and retrying
  # the report would only reword it.
  #
  # THREE LEDGERS, THREE CHECKS, THREE SECTIONS. The sweep produces three kinds
  # of finding and they are not interchangeable:
  #
  #   unexplained  — a named function nobody could explain. Fix: simplify it.
  #   unstated     — a module whose boundary defeated three attempts. Fix
  #                  depends on what the descent found, which is why the entry
  #                  carries it.
  #   unfocused    — a module that explains fine but describes more than one
  #                  job. Fix: split it, or correct its row in
  #                  docs/architecture.md if the row is what is wrong.
  #
  # They get separate files and separate checks so a failure says which kind
  # it is without anyone parsing prose, and so the report can be read by
  # someone who was not here.
  report:
    description: >
      Write `.headsign/tmp/summary.md` for a reader who did not watch the run
      and cannot see any other file. Four parts, in this order:

      1. **What was swept**, copied from `.headsign/tmp/scope`, and one line
         saying what that certifies — a sweep of one module certifies that
         module and nothing wider.
      2. **The verdict**: passed, or failed and how many of each kind of
         finding.
      3. **The findings**, one section per kind, in this order: functions
         nobody could explain, modules whose boundary could not be stated,
         modules that are explainable but do more than one job. Every entry
         names the thing, says where the reader lost the thread, and says what
         you think should change. An entry a person cannot act on is not an
         entry.
      4. **What this sweep did not look at** — for a module whose boundary was
         approved, none of its functions were examined, and that is worth
         stating rather than leaving to be inferred.

      Name things, never positions: "the second finding" means nothing to
      someone holding only this file. Copy the summary to
      `.headsign/notes/last-sweep.md` before you finish; `.headsign/tmp/` does
      not survive the next `headsign start`.

      Any non-empty ledger escalates. That is the fitness function failing,
      and the answer is to change what it names — not to write a better
      report.
    gate:
      checks:
        - name: summary written
          run: "test -s .headsign/tmp/summary.md"
        - name: the summary says what was swept
          # The scope is set by `inventory`, which is the phase that knows it.
          # Reconstructing it here, six phases later, is how a report ends up
          # claiming more than the run earned.
          run: 'grep -qF -e "$(cat .headsign/tmp/scope)" .headsign/tmp/summary.md'
        - name: the queue was really emptied
          # `record`'s gate only proves the CLAIMED item left the queue, so an
          # agent that removed one line too many takes the normal edge to
          # `learn` and arrives here with work undone. Nothing else ever asks
          # whether the sweep finished what it started.
          run: "! cat .headsign/tmp/queue 2>/dev/null | grep -q '[^[:space:]]'"
        # The three verdict checks. Separate rather than one alternation so a
        # failure names the kind. Each pipes through `cat` because a clean
        # sweep never creates the file, and grep reports a missing file as an
        # error (exit 2), which is not the same answer as "not found".
        - name: no function went unexplained
          run: "! cat .headsign/tmp/unexplained 2>/dev/null | grep -q '[^[:space:]]'"
        - name: every module's boundary could be stated
          run: "! cat .headsign/tmp/unstated 2>/dev/null | grep -q '[^[:space:]]'"
        - name: every module describes one job
          run: "! cat .headsign/tmp/unfocused 2>/dev/null | grep -q '[^[:space:]]'"
    on_pass: $end
    # No max_attempts: `on_fail: escalate` ends the run on the first failure,
    # so an attempt budget here could never be spent (validate rejects the
    # pair).
    on_fail: escalate

limits:
  # Not "how many phases are there" but "how many gate evaluations does the
  # whole sweep cost". Each function costs three (explain, judge, record) when
  # the first explanation lands, five at two tries, seven at three, and the
  # four one-off phases cost one each.
  #
  # THIS NUMBER ASSUMES ONE MODULE PER RUN, which is what `inventory` now asks
  # for. The largest module in src/ is 23 functions: 73 laps if nothing is
  # rejected, 165 if every single function burns all three tries. 300 is
  # comfortably above both, which is what makes it a runaway backstop rather
  # than a budget.
  #
  # Widen the scope and you must raise this number too. All of src/ is ~89
  # functions — 271 laps before a single rejection, against a ceiling of 300,
  # so fifteen rejections put an ordinary sweep through the wall. A whole-repo
  # run wants ~700. Reaching the ceiling no longer ends the run (ADR-0017), so
  # this is recoverable, but the sweep stops mid-list until someone raises it.
  max_total_iterations: 300
