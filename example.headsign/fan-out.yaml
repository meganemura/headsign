# fan-out.yaml — many pieces of work at once, where the agent decides how many
# and by what machinery, and headsign gates only what came back.
#
# The README's position on this is already plain: headsign "has no opinion
# about how the agent gets a phase done: if it wants to hand a step to three
# subagents, or run two things at once, that is its call to make, not this
# tool's to grant." This file used to grant it anyway. Its `split` gate
# required a git worktree and a child `headsign start` for every item, so an
# agent that judged three subagents in this one tree to be the better division
# failed a gate for being right. That check is gone.
#
# The line this file now draws, and the one worth taking away from it:
#
#   the graph sequences CHECKS. The agent sequences WORK.
#
# A phase order fixes when a fact has to be proven. It fixes nothing about when
# the work happens, who does it, or how many of them there are. Everything
# below follows from that.
#
# So the division is the agent's to make, and so is the machinery. Two shapes
# are worth naming, because they are chosen for different reasons:
#
#   - **Subagents inside this run.** The right choice when a piece is small
#     enough that the gates at the end of THIS run are enough discipline for
#     it. Nothing is started, nothing is joined, and this file never learns
#     they existed.
#   - **A child run per worktree.** The right choice when a piece is big
#     enough to deserve gates of its own — its own phases, its own attempts,
#     its own state surviving its own compaction. Those are ordinary runs in
#     ordinary directories ("One worktree, one run" in
#     docs/workflow-reference.md), and a tree of their own is what keeps each
#     one's checks judging its own changes rather than a neighbour's.
#
# The agent may choose either, or both at once, or change its mind about a
# piece. What this file adds is the join, and only for the pieces that were
# given runs of their own: `gather` below, whose two fields ask two different
# questions — `ready:` asks "has everyone finished talking?", and the gate asks
# "did everyone pass?". The joining strategies an orchestrator hands you as
# modes (all_of, any_of, quorum) need no field here. They are three shell
# one-liners, and all three are written out at that gate.
#
# A run whose agent gave nothing its own run routes straight past `gather`, and
# the same last phase judges the result either way.
#
# Conventions this workflow relies on (own them, they are not headsign's):
#   .headsign/tmp/plan.md — the division, in the agent's own words: what the
#                           pieces are, and which machinery each one got.
#                           Written before the work starts, for the reason
#                           sweep.yaml surveys before it applies — a division
#                           decided halfway through is shaped by the half
#                           already done.
#   .headsign/tmp/items   — ONLY the pieces that were given a child run, one
#                           short slug per line, each usable as a directory
#                           and branch name (`parser`, `docs-api`). The loops
#                           below word-split this file, so no spaces and no
#                           glob characters. Empty is an ordinary answer: it
#                           says the agent kept every piece in this run.
#   .worktrees/<item>     — that item's worktree, holding that item's child
#                           run. Created and removed by the agent. Add
#                           `.worktrees/` to your .gitignore: the
#                           `.headsign/.gitignore` headsign maintains covers
#                           its own tmp/ and knows nothing about anything else
#                           a workflow invents.
#
# SWAP: every `headsign` below that runs inside a worktree. This directory has
# the CLI on PATH; a fresh worktree may not. Use `npx headsign`, or the
# plugin's bundled path, whichever your setup gives you. (If no invocation
# reaches inside a worktree at all, the last resort is grepping the child's
# `.headsign/state.json` — but that file is headsign's internal, pre-1.0
# format, while `headsign status`'s first line is a documented contract.)

version: 0.1
name: fan-out
entry: split

phases:
  # ── split ────────────────────────────────────────────────────────────────
  # Decide the division, write it down, and set going whatever needs its own
  # run. The gate proves the decision was recorded and that the runs named in
  # it really exist — it has no opinion about what the decision was.
  split:
    description: >
      Divide the work into pieces that can be finished independently: no piece
      may wait on another piece's change, because nothing here will sequence
      them. How to divide it is your judgment, and so is how many pieces there
      are — you can see the work and this file cannot.

      Choose the machinery per piece. Keep a piece in this run, handled by
      subagents you spawn however you see fit, when the checks at the end of
      this run are discipline enough for it. Give a piece a run of its own —
      `git worktree add .worktrees/<item> -b <item>`, then `cd
      .worktrees/<item> && headsign start` (or `headsign start <name>` for a
      different workflow) — when it is large enough to want gates, attempts
      and recoverable state of its own. There is nothing to copy into a
      worktree: it is a checkout of the same commit, so the committed
      `.headsign/*.yaml` is already there.

      Write the division to `.headsign/tmp/plan.md` — the pieces, and which
      machinery each one got. Then write to `.headsign/tmp/items` the slug of
      every piece you gave a child run, one per line, and nothing else. Leave
      that file empty if you gave none; that is an ordinary answer and the run
      routes around the join.

      Once a child has started, stop driving it from here. Each child run is
      driven by its own agent, one `headsign next` at a time, exactly like
      this one. If you hand a child to a delegated agent, that agent's first
      command in the worktree is `headsign claim`, before any work (see
      Multiple sessions in docs/workflow-reference.md).
    # Cleared on entry, which for the entry phase means on `headsign start`:
    # a list left behind by the previous fan-out would send `gather` looking
    # for worktrees that belong to a run that is already over.
    #
    # Note what is NOT cleared: the worktrees. `clear:` deletes files, and
    # deleting a worktree directory out from under git is not the same as
    # removing it — cleanup is a git operation, so it stays with the agent,
    # in `integrate`.
    clear: [.headsign/tmp/plan.md, .headsign/tmp/items]
    gate:
      checks:
        - name: the division is written down
          # The one thing asked of the decision itself, and it asks nothing
          # about its content: that it was made before the work rather than
          # discovered during it.
          run: "test -s .headsign/tmp/plan.md"
        - name: every item promised a run of its own has one already started
          # This verifies the agent's OWN recorded choice; it prescribes
          # none. `state.json` exists in a worktree only after `headsign
          # start` really ran there, so a slug written into `items` with no
          # run behind it fails here rather than at `gather`, where the
          # failure would look like a child's.
          #
          # Vacuous over an empty `items`, which is exactly right: an agent
          # that started no child runs promised none.
          run: 'for i in $(cat .headsign/tmp/items); do
            test -f ".worktrees/$i/.headsign/state.json" || exit 1; done'
    # The route replaces what used to be a check. Requiring at least one item
    # was how this file forced child runs to exist at all; asking the file
    # instead lets the answer be none, and still keeps `gather` from joining
    # an empty list and passing vacuously.
    on_pass:
      - when: "grep -q '[^[:space:]]' .headsign/tmp/items"
        to: gather
      - to: integrate
    max_attempts: 3

  # ── gather ───────────────────────────────────────────────────────────────
  # The join, and the reason this example exists. Two questions, two fields:
  # `ready:` is "has everyone finished talking?", the gate is "did everyone
  # pass?" — and they have to be asked separately, because a child that is
  # still RUNNING has not failed anything yet. Collapse them into one gate and
  # every early `headsign next` reads as a failure and burns an attempt on
  # children that are doing fine.
  #
  # Reached only when the agent gave at least one piece a run of its own.
  gather:
    description: >
      Wait for the children. They are driven by their own agents in their own
      worktrees; do not push them along from here, and do not answer a child's
      `headsign next` yourself to hurry it up. To look, run `headsign status`
      in each worktree — it is read-only: no gate runs, no state is written,
      no lock is taken. Then ask `headsign next` here. While any child is
      still going you get PENDING, which spends no attempt, so asking early
      costs nothing.
    # PENDING while any child is still RUNNING (docs/adr/0002): waiting is
    # not failing. Note that nothing blocks — headsign answers PENDING and
    # returns, and the next `headsign next` asks the question again. The
    # "waiting" is the agent's, and it is one probe long.
    #
    # `headsign status` rather than a peek at the child's state.json: it
    # judges nothing, writes nothing and takes no lock, and its first line
    # is a documented contract (RUNNING / COMPLETE / ESCALATED / ABORTED).
    # Only RUNNING carries anything after the word — the phase and the
    # attempt count — which is why this one is anchored with `^` while the
    # gate below can ask for a whole line. A worktree that has vanished
    # reads as not-RUNNING here and then fails the gate below, which is the
    # right way round: a missing child is a question for a person, not
    # something to wait on forever.
    ready: 'for i in $(cat .headsign/tmp/items); do
      (cd ".worktrees/$i" && headsign status) | head -n 1
      | grep -q ^RUNNING && exit 1; done; exit 0'
    gate:
      checks:
        - name: every child run finished COMPLETE
          # ALL_OF — one child short of COMPLETE fails the whole gate. The
          # other two joins, the ones an orchestrator would give you a mode
          # for, are this same loop with the test moved. No field in this
          # file changes, because none of this is a headsign feature:
          #
          #   any_of — one COMPLETE child is enough:
          #     for i in $(cat .headsign/tmp/items); do (cd ".worktrees/$i" \
          #       && headsign status) | head -n 1 | grep -qx COMPLETE \
          #       && exit 0; done; exit 1
          #
          #   quorum — at least N of them (N=2 here):
          #     n=0; for i in $(cat .headsign/tmp/items); do (cd \
          #       ".worktrees/$i" && headsign status) | head -n 1 \
          #       | grep -qx COMPLETE && n=$((n+1)); done; [ "$n" -ge 2 ]
          #
          # An empty list would pass all_of vacuously; what prevents that is
          # the route out of `split`, which sends an empty list to
          # `integrate` and never arrives here.
          run: 'for i in $(cat .headsign/tmp/items); do
            (cd ".worktrees/$i" && headsign status) | head -n 1
            | grep -qx COMPLETE || exit 1; done'
    on_pass: integrate
    # A child that ended ESCALATED or ABORTED is a decision someone has
    # already stopped on, and no amount of re-running this gate restarts a
    # run that has ended. There is also no work in this phase to retry — so
    # the failure goes where it belongs, to a person. Deliberately no
    # `max_attempts` beside it: `escalate` fires on the first failure, which
    # would make the budget dead code, and validate rejects the pair
    # outright (docs/adr/0014).
    on_fail: escalate

  # ── integrate ────────────────────────────────────────────────────────────
  # Judge the whole result, however it was produced. This is the first time
  # the suite sees every piece together, and it is the same gate whether the
  # pieces came from subagents in this tree, from child runs, or from both.
  integrate:
    description: >
      Bring the work together and get the suite green over the combined
      result. If you gave pieces their own runs, merge each item's branch into
      this one first and resolve whatever conflicts the division failed to
      prevent, then put the tools away: `git worktree remove
      .worktrees/<item>` for every item, `git worktree prune` if a directory
      was already deleted by hand, and delete the merged branches. If a merge
      turns out to need work that belongs to a child, do it here on this
      branch and say so in your report — the child's run is over, and nothing
      restarts it.
    gate:
      checks:
        - name: full suite passes over the combined result
          # swap-me: your project's test command, e.g.
          #   pytest / go test ./... / bundle exec rspec
          run: "npm test"
          timeout: 600
        - name: no worktree left behind
          # Cleanup is checked because it is the part everyone skips, and
          # because a leftover worktree is not harmless: the next fan-out
          # would find `.worktrees/<item>` already there and `git worktree
          # add` would refuse. Empty or absent both pass — `git worktree
          # remove` takes the item's directory and leaves the parent, and a
          # run that made no worktree at all never creates one.
          run: 'test -z "$(ls -A .worktrees 2>/dev/null)"'
    on_pass: $end
    max_attempts: 3

limits:
  # Three phases and slack for a few rounds of merge trouble. Note what
  # this number does not cover: any child's laps. Each child run keeps
  # its own attempts and its own ceiling in its own worktree, and this run
  # can neither see nor bound them — the budget here counts gate
  # evaluations in THIS directory, of which `gather`'s waiting costs none
  # (a probe that answers PENDING spends nothing).
  max_total_iterations: 20
