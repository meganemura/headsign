# workflow.yaml — the default workflow for developing headsign itself.
#
# This repository dogfoods its own tool: `.headsign` at the repo root is a
# symlink to this directory, so `headsign start` here runs THIS file. The
# implement gate mirrors CI exactly — if these four checks pass locally, CI
# has nothing new to say.
version: 0.1
name: headsign-dev
entry: implement

phases:
  implement:
    description: >
      Make the change test-first where practical. Keep engine.ts pure and
      respect the module boundaries in docs/architecture.md. If a behavioral
      guarantee changed, amend the ADR that owns it in the same change, and
      keep README.md / README.ja.md in parity. Rebuild the bundle before
      asking for the verdict.
    gate:
      checks:
        - name: typecheck
          run: "npm run typecheck"
        - name: tests
          run: "npm test"
          timeout: 300
        # The committed bundle is what every user's hook executes; it must be
        # exactly what src builds to (same check CI runs).
        - name: bundle matches src
          run: "npm run build && git diff --quiet -- plugin/dist"
        # Plugin updates are distributed by version string; a drifted pair
        # means users silently stop receiving updates.
        - name: versions in lockstep
          run: >
            node -e "const p=require('./package.json').version,
            q=require('./plugin/.claude-plugin/plugin.json').version;
            if(p!==q){console.error('version mismatch: '+p+' vs '+q);process.exit(1)}"
    on_pass: review
    max_attempts: 5

  review:
    description: >
      Spawn a read-only reviewer subagent (Read/Grep/Glob) to check the diff
      against docs/architecture.md's module boundaries, the line-count
      guideline, and README EN/JA parity. Have it REPORT exactly APPROVED or
      REJECTED with reasons, then write that verdict verbatim to
      .headsign/tmp/verdict yourself.
    clear: [.headsign/tmp/verdict]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: review approved
          run: "grep -qx APPROVED .headsign/tmp/verdict"
    on_pass: $end
    on_fail: implement
    max_attempts: 3

limits:
  max_total_iterations: 15
