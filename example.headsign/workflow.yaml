# workflow.yaml — the smallest workflow worth running, and the file name
# `headsign start` picks when you give it no name.
#
# Two phases: do the work behind gates that can't be talked round, then have
# someone other than the writer look at it. Copy this one first if you are
# not sure which example you want — the role-specific files in this directory
# are all this shape with more phases in the middle.
#
# The gates below are placeholders for YOUR project's commands (marked
# swap-me). Aim them at the same checks your CI runs: if these pass locally,
# CI has nothing new to say, which is the whole reason to gate on them here.
version: 0.1
name: minimal
entry: implement

phases:
  implement:
    description: >
      Make the change test-first where practical. Keep it to one coherent
      piece of work — the review phase below reads a diff, and a diff that
      does three things gets one verdict for all three. Update whatever
      documentation states the behaviour you changed, in the same change,
      before asking for the verdict.
    gate:
      checks:
        # swap-me: your project's type or static check, e.g.
        #   mypy . / go vet ./... / cargo check
        - name: typecheck
          run: "npm run typecheck"
        # swap-me: your project's test command, e.g.
        #   pytest / go test ./... / bundle exec rspec
        - name: tests
          run: "npm test"
          timeout: 300
    on_pass: review
    max_attempts: 5

  review:
    description: >
      Spawn a read-only reviewer subagent (Read/Grep/Glob) to check the diff
      against whatever standard your project holds itself to — module
      boundaries, the tests actually covering the change, documentation kept
      in step. As the driving agent, fingerprint HEAD, tracked changes, and
      untracked non-ignored files before and after the reviewer reads them.
      Give the first identifier to the reviewer, then record two lines:
      APPROVED or REJECTED, followed by REVISION and the unchanged fingerprint.
      Write those two lines to .headsign/tmp/verdict and put reasons in
      .headsign/tmp/review-notes.md. You hold the pen on the gate file, so the
      independent read remains the source of the decision.
    clear: [.headsign/tmp/verdict, .headsign/tmp/review-notes.md, .headsign/tmp/review-current, .headsign/tmp/review-untracked]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: current review approved
          run: >-
            awk 'NR == 1 { ok = ($0 == "APPROVED") }
            NR == 2 { value = substr($0, 10); ok = ok &&
            substr($0, 1, 9) == "REVISION " &&
            (length(value) == 40 || length(value) == 64) &&
            value !~ /[^0-9a-f]/ } NR > 2 { ok = 0 }
            END { exit !(ok && NR == 2) }' .headsign/tmp/verdict
        - name: review covers current fingerprint scope
          run: >-
            expected=$(sed -n '2s/^REVISION //p' .headsign/tmp/verdict) &&
            git rev-parse 'HEAD^{tree}' > .headsign/tmp/review-current &&
            git diff --no-ext-diff --binary HEAD -- >> .headsign/tmp/review-current &&
            git ls-files --others --exclude-standard -z > .headsign/tmp/review-untracked &&
            xargs -0 sh -c 'for f do printf "%s\0" "$f";
            git hash-object -- "$f" || exit; done' sh < .headsign/tmp/review-untracked >> .headsign/tmp/review-current &&
            current=$(git hash-object .headsign/tmp/review-current) &&
            test -n "$expected" && test "$expected" = "$current"
    on_pass: $end
    on_fail: implement
    max_attempts: 3

limits:
  max_total_iterations: 15
