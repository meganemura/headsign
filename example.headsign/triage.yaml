# triage.yaml — headsign's own feedback-intake loop. One run = one ticket.
#
# Feedback tickets accumulate, pull-style, in a PRIVATE aggregation
# repository; its location resolves via `git config --global
# headsign.feedbackDir` (never a relative/sibling path — that breaks under
# git worktrees). Tickets carry frontmatter (severity, created), a Judgment
# section (decision: accept / reject / defer + reason) and a Response
# section, and move feedback/inbox/ -> judged/ -> done/ as they progress.
#
# This repository is PUBLIC. Nothing that identifies a feedback source may
# enter any artifact here (code, commit messages, docs, tests): no private
# project names, no ticket ids, no quoted logs or paths. Generalize
# everything; the ticket-to-commit link lives in the ticket's Response
# field on the private side only. See docs/maintenance.md.
version: 0.1
name: feedback-triage
entry: triage

phases:
  triage:
    description: >
      Let FB="$(git config --global headsign.feedbackDir)". If
      feedback/judged/ under it already holds a ticket with "decision:
      accept", that is your work item from an earlier run — touch
      .headsign/tmp/triage-done and run `headsign next` to proceed.
      Otherwise take exactly ONE ticket from feedback/inbox/ — severity
      high before mid before low (frontmatter), oldest `created` first
      within a severity — and judge it alone; never batch. Fill its
      Judgment section: decision (accept / reject / defer) plus a reason.
      Then move it with `git mv`: accept and defer go to feedback/judged/;
      reject goes straight to feedback/done/ with the reason written
      carefully. Commit in the feedback repository. When triage is done —
      one ticket judged, or the inbox turned out empty — touch
      .headsign/tmp/triage-done and run `headsign next`. A reject, defer
      or empty inbox means no implementation this run — the gate below
      then ends the run cleanly; that is the intended outcome, not a
      failure.
    # ready: is this run's own "I finished triaging" declaration, NOT a
    # probe of the queue: the queue alone cannot distinguish "just
    # rejected the last ticket" (should end cleanly) from "haven't
    # started yet" (should keep waiting), and a premature `next` before
    # judging must PENDING-wait here rather than fall through to the
    # clean-exit fail below.
    ready: "test -f .headsign/tmp/triage-done"
    gate:
      checks:
        # Judged state lives in the ticket files themselves: an accepted
        # ticket sitting in judged/ IS the work queue (capacity one by
        # convention). Deferred tickets may sit in judged/ too — the grep
        # keys on the decision, so they never trigger implementation.
        - name: accepted ticket in judged/
          run: 'grep -qs "decision: accept" "$(git config --global headsign.feedbackDir)"/feedback/judged/*.md'
    on_pass: implement
    # Triage that produced no accepted ticket (reject, defer, or an empty
    # inbox) ends the run cleanly (COMPLETE). Deliberately no max_attempts
    # here — with $end on the first fail, a second attempt can never
    # happen.
    on_fail: "$end"

  implement:
    description: >
      Implement the accepted ticket (the "decision: accept" file in the
      feedback repository's feedback/judged/). Work test-first where
      practical, keep engine.ts pure, respect docs/architecture.md module
      boundaries, keep README.md / README.ja.md in parity, and rebuild the
      bundle before asking for the verdict. PUBLIC-REPO RULE: commit
      messages, code, tests and docs must describe the change in general
      terms only — never the feedback source's project name, ticket id,
      quoted logs or paths. Rewrite reproduction steps neutrally. Commit in
      meaningful units.
    gate:
      checks:
        - name: typecheck
          run: "npm run typecheck"
        - name: tests
          run: "npm test"
          timeout: 300
        - name: bundle matches src
          run: "npm run build && git diff --quiet -- plugin/dist"
        - name: versions in lockstep
          run: >
            node -e "const p=require('./package.json').version,
            q=require('./plugin/.claude-plugin/plugin.json').version;
            if(p!==q){console.error('version mismatch: '+p+' vs '+q);process.exit(1)}"
    on_pass: review
    max_attempts: 5

  review:
    description: >
      Spawn a read-only reviewer subagent (Read/Grep/Glob) to check the
      diff against docs/architecture.md's module boundaries, the line-count
      guideline, README EN/JA parity — and the public-repo rule above: the
      diff and its commit messages must contain nothing that identifies the
      feedback source. Have it REPORT exactly APPROVED or REJECTED with
      reasons, then write that verdict verbatim to .headsign/tmp/verdict
      yourself.
    clear: [.headsign/tmp/verdict]
    ready: "test -f .headsign/tmp/verdict"
    gate:
      checks:
        - name: review approved
          run: "grep -qx APPROVED .headsign/tmp/verdict"
    on_pass: respond
    on_fail: implement
    max_attempts: 3

  respond:
    description: >
      Close the loop on the private side: fill the ticket's Response
      section with what was done and the public commit hash(es), `git mv`
      the ticket from feedback/judged/ to feedback/done/, and commit the
      feedback repository. The link always points private -> public; never
      add the reverse link in this repository.
    gate:
      checks:
        # Mechanical: the accepted ticket really left the queue.
        - name: no accepted ticket left in judged/
          run: '! grep -qs "decision: accept" "$(git config --global headsign.feedbackDir)"/feedback/judged/*.md'
    on_pass: "$end"
    max_attempts: 3

limits:
  max_total_iterations: 20
