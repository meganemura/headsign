name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: dist matches src
        run: git diff --exit-code plugin/dist

      - name: plugin version matches package version
        run: |
          node -e "const p=require('./package.json').version,q=require('./plugin/.claude-plugin/plugin.json').version;if(p!==q){console.error(\`version mismatch: package.json=\${p} plugin.json=\${q}\`);process.exit(1)}"
