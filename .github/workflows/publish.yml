# Publishes the npm package for a v* tag.
# headsign is already on npm. This file is the publish path: no token
# bootstrap, and it never reads NPM_TOKEN.
# Boundary: checkout the tag, run the release checks, and npm publish.
# A second job then creates the GitHub Release. It is separate so
# contents:write never sits on the job that holds the npm OIDC token.
# The GitHub Environment `publish` approves the run. npm authenticates
# with that environment's OIDC token. Provenance is attached because
# the repository and the package are public.
name: Publish

on:
  push:
    tags:
      - "v*"

# Declared here even though the repository default is `read`, because a recipe
# copied out of this file travels to a repository whose default may not be.
# Each job below replaces this set rather than extending it. `publish`
# repeats `contents: read` and adds `id-token: write`. `release` sets
# `contents: write` only.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: publish
    # The suite spawns a shell per gate check; a wedged one would otherwise
    # burn the default six hours after a reviewer has already approved.
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: read
    steps:
      # Actions are pinned by commit, with the version in a comment, same as
      # ci.yml. A tag is a pointer. These are checkout v7.0.1 and setup-node
      # v7.0.0.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          # A release build installs from the lockfile only. The setup-node
          # package cache is a write path from other workflows.
          package-manager-cache: false

      - name: Require Node 24 and npm 11.5.1
        run: |
          node --version
          npm --version
          node <<'EOF'
          const [nodeMajor] = process.versions.node.split(".").map(Number);
          if (nodeMajor !== 24) {
            console.error(`Node ${process.versions.node} is not Node 24`);
            process.exit(1);
          }
          const {execSync} = require("node:child_process");
          const [major, minor, patch] = execSync("npm --version", {encoding: "utf8"})
            .trim()
            .split(".")
            .map(Number);
          if (!(major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1))))) {
            console.error(`npm ${major}.${minor}.${patch} is older than 11.5.1`);
            process.exit(1);
          }
          EOF

      - name: Match the tag to package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      # `--ignore-scripts` on the line, not only in .npmrc, because whoever copies
      # this step takes the line and leaves the file behind. The same setting
      # skips `prepublishOnly`, so the steps below are what actually runs.
      - run: npm ci --ignore-scripts

      - run: npm run typecheck

      # Coverage, not `npm test`: same files, same runner, plus the thresholds
      # CI holds. Running both would race real processes against a lock twice.
      - run: npm run coverage

      - run: npm run build

      - name: Refuse a build that changes the tagged tree
        run: |
          # plugin/dist/headsign.mjs is committed. The build must reproduce
          # it. A rewritten bundle is not an untracked dist/ this step should
          # ignore — dist is in the tree — so any porcelain, tracked or not,
          # fails the publish.
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            exit 1
          fi

      - run: npm publish

  # Runs only after npm publish succeeds. A separate job keeps contents:write
  # away from the job that holds the npm OIDC token.
  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create the GitHub release from this version's changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # --notes-file CHANGELOG.md would carry every version, so extract only this one.
          # Headings are Keep a Changelog: "## [X.Y.Z] - date". The brackets keep
          # a shorter version from matching a longer one. The archstrict pattern
          # is the same awk, against headings written "## X.Y.Z ".
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {in_version=1; next} /^## /{in_version=0} in_version' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "CHANGELOG.md has no section for ${version}" >&2
            exit 1
          fi
          # A re-run of the same tag must not fail on a release that already exists.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release ${GITHUB_REF_NAME} already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
